apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-app-ingress
  namespace: {{ .Values.global.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "{{ .Values.ingress.sslRedirect }}"
    nginx.ingress.kubernetes.io/app-root: {{ .Values.ingress.appRoot }}
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: {{ .Values.backend.path }}  
            pathType: {{ .Values.ingress.rules.pathType }}  
            backend:
              service:
                name: {{ .Release.Name }}-backend
                port:
                  number: {{ .Values.backend.port }}
          - path: {{ .Values.frontend.path }}         
            pathType: {{ .Values.ingress.rules.pathType }}
            backend:
              service:
                name: {{ .Release.Name }}-frontend
                port:
                  number: {{ .Values.frontend.port }}